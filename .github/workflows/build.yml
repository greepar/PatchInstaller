name: build

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.104"

      - name: Prepare Tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.0.0/upx-5.0.0-win64.zip" -OutFile "upx.zip"
          7z x -y .\upx.zip -o"."
          Move-Item .\upx-5.0.0-win64\upx.exe .\upx.exe -Force

      - name: Restore
        shell: pwsh
        run: dotnet restore .\PatchInstaller.slnx

      - uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Publish AOT
        shell: pwsh
        run: dotnet publish .\PatchInstaller\PatchInstaller.csproj -c Release -r win-x64 -p:UseNativeAotProps=true -o .\artifacts\publish-aot

      - name: Publish DotNet Compression
        shell: pwsh
        run: |
          dotnet publish .\PatchInstaller\PatchInstaller.csproj -c Release -r win-x64 `
            -p:UseNativeAotProps=false `
            -p:PublishAot=false `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=true `
            -p:PublishReadyToRun=false `
            -o .\artifacts\publish-dotnet-compression

      - name: Package AOT
        shell: pwsh
        run: |
          $publishDir = ".\artifacts\publish-aot"
          $exeFile = Get-ChildItem -Path $publishDir -Filter "*.exe" | Select-Object -First 1
          $pdbFile = Get-ChildItem -Path $publishDir -Filter "*.pdb" | Select-Object -First 1

          if ($null -eq $exeFile) {
            throw "No .exe file found in AOT publish output."
          }

          7z a -y -mx9 PatchInstaller.AOT.7z $exeFile.FullName

          if ($null -ne $pdbFile) {
            7z a -y -mx9 PatchInstaller.AOT.PDB.7z $pdbFile.FullName
          }

      - name: Package DotNet Compression
        shell: pwsh
        run: |
          $publishDir = ".\artifacts\publish-dotnet-compression"
          $jsonExamplePath = ".\PatchInstaller\PatchInstaller.json.example"
          $exeFile = Get-ChildItem -Path $publishDir -Filter "*.exe" | Select-Object -First 1
          $pdbFile = Get-ChildItem -Path $publishDir -Filter "*.pdb" | Select-Object -First 1

          if ($null -eq $exeFile) {
            throw "No .exe file found in DotNet Compression publish output."
          }

          if (-not (Test-Path $jsonExamplePath)) {
            throw "PatchInstaller.json.example not found."
          }

          $exePath = $exeFile.FullName
          $pdbPath = if ($null -ne $pdbFile) { $pdbFile.FullName } else { $null }

          7z a -y -mx9 PatchInstaller.DotNetCompression.7z $exePath

          if ($null -ne $pdbPath) {
            7z a -y -mx9 PatchInstaller.DotNetCompression.PDB.7z $pdbPath
          }

          .\upx.exe --ultra-brute --overlay=strip $exePath -o .\PatchInstaller.DotNetCompression.UPX.exe
          7z a -y -mx9 PatchInstaller.DotNetCompression.UPX.7z .\PatchInstaller.DotNetCompression.UPX.exe

          Copy-Item $jsonExamplePath .\PatchInstaller.json -Force

      - name: Release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          overwrite_files: true
          generate_release_notes: true
          files: |
            PatchInstaller.AOT.7z
            PatchInstaller.AOT.PDB.7z
            PatchInstaller.DotNetCompression.7z
            PatchInstaller.DotNetCompression.UPX.7z
            PatchInstaller.DotNetCompression.PDB.7z
            PatchInstaller.json
