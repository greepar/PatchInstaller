name: build

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.104"

      - name: Prepare Tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.0.0/upx-5.0.0-win64.zip" -OutFile "upx.zip"
          7z x -y .\upx.zip -o"."
          Move-Item .\upx-5.0.0-win64\upx.exe .\upx.exe -Force

      - name: Restore
        shell: pwsh
        run: dotnet restore .\PatchInstaller.slnx

      - uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Publish AOT
        shell: pwsh
        run: dotnet publish .\PatchInstaller\PatchInstaller.csproj -c Release -r win-x64 -p:UseNativeAotProps=true -o .\artifacts\publish-aot

      - name: Publish DotNet Compression
        shell: pwsh
        run: |
          $runtimes = @("win-x64", "osx-x64", "osx-arm64", "linux-x64", "linux-arm64")
          foreach ($runtime in $runtimes) {
            $platformTarget = if ($runtime.EndsWith("-arm64")) { "arm64" } else { "x64" }
            dotnet publish .\PatchInstaller\PatchInstaller.csproj -c Release -r $runtime `
              -p:UseNativeAotProps=false `
              -p:PlatformTarget=$platformTarget `
              -p:PublishAot=false `
              -p:SelfContained=true `
              -p:PublishSingleFile=true `
              -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:PublishTrimmed=true `
              -p:PublishReadyToRun=false `
              -o ".\artifacts\publish-dotnet-compression\$runtime"
          }

      - name: Package AOT
        shell: pwsh
        run: |
          $publishDir = ".\artifacts\publish-aot"
          $exeFile = Get-ChildItem -Path $publishDir -Filter "*.exe" | Select-Object -First 1
          $pdbFile = Get-ChildItem -Path $publishDir -Filter "*.pdb" | Select-Object -First 1

          if ($null -eq $exeFile) {
            throw "No .exe file found in AOT publish output."
          }

          7z a -y -mx9 PatchInstaller.win-x64.AOT.7z $exeFile.FullName

          if ($null -ne $pdbFile) {
            7z a -y -mx9 PatchInstaller.win-x64.AOT.PDB.7z $pdbFile.FullName
          }

          .\upx.exe --ultra-brute --overlay=strip $exeFile.FullName -o .\PatchInstaller.win-x64.AOT.UPX.exe
          7z a -y -mx9 PatchInstaller.win-x64.AOT.UPX.7z .\PatchInstaller.win-x64.AOT.UPX.exe

      - name: Package DotNet Compression
        shell: pwsh
        run: |
          $jsonExamplePath = ".\PatchInstaller\PatchInstaller.json.example"

          if (-not (Test-Path $jsonExamplePath)) {
            throw "PatchInstaller.json.example not found."
          }

          $runtimes = @("win-x64", "osx-x64", "osx-arm64", "linux-x64", "linux-arm64")
          foreach ($runtime in $runtimes) {
            $publishDir = ".\artifacts\publish-dotnet-compression\$runtime"
            $packageDir = ".\artifacts\package-dotnet-compression\$runtime"
            $archivePath = ".\PatchInstaller.$runtime.DotNetCompression.7z"

            if (-not (Test-Path $publishDir)) {
              throw "Publish output not found for $runtime."
            }

            if (Test-Path $packageDir) {
              Remove-Item $packageDir -Recurse -Force
            }

            New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
            Copy-Item "$publishDir\*" $packageDir -Recurse -Force
            Copy-Item $jsonExamplePath "$packageDir\PatchInstaller.json" -Force
            7z a -y -mx9 $archivePath "$packageDir\*"
          }

          $pdbFile = Get-ChildItem -Path ".\artifacts\publish-dotnet-compression\win-x64" -Filter "*.pdb" | Select-Object -First 1

          if ($null -ne $pdbFile) {
            7z a -y -mx9 PatchInstaller.win-x64.DotNetCompression.PDB.7z $pdbFile.FullName
          }

          Copy-Item $jsonExamplePath .\PatchInstaller.json -Force

      - name: Release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          overwrite_files: true
          generate_release_notes: true
          files: |
            PatchInstaller.win-x64.AOT.7z
            PatchInstaller.win-x64.AOT.PDB.7z
            PatchInstaller.win-x64.AOT.UPX.7z
            PatchInstaller.win-x64.DotNetCompression.7z
            PatchInstaller.win-x64.DotNetCompression.PDB.7z
            PatchInstaller.osx-x64.DotNetCompression.7z
            PatchInstaller.osx-arm64.DotNetCompression.7z
            PatchInstaller.linux-x64.DotNetCompression.7z
            PatchInstaller.linux-arm64.DotNetCompression.7z
            PatchInstaller.json
